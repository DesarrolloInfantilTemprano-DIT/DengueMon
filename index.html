<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión y Edición - Censo SIGIS_FED</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card-custom { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .loading-overlay { display: none; background: rgba(255,255,255,0.8); position: fixed; top:0; left:0; width:100%; height:100%; z-index:9999; justify-content:center; align-items:center; }
    </style>
</head>
<body>

    <!-- Spinner de Carga -->
    <div id="loader" class="loading-overlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card card-custom p-4 bg-white">
                    <h3 class="text-center mb-4 text-primary fw-bold">Gestión de Censo SIGIS_FED</h3>
                    
                    <!-- Buscador por DNI -->
                    <div class="input-group mb-3">
                        <input type="text" id="inputDni" class="form-control" placeholder="Ingrese DNI a consultar..." maxlength="15">
                        <button class="btn btn-primary" type="button" onclick="buscarPorDni()">Buscar</button>
                    </div>

                    <div id="mensajeAlerta" class="alert d-none" role="alert"></div>

                    <!-- Formulario de Edición (Oculto al inicio) -->
                    <div id="formContainer" class="d-none mt-3">
                        <hr>
                        <h5 class="mb-3 text-secondary">Datos del Ciudadano</h5>
                        <form id="editForm" onsubmit="guardarCambios(event)">
                            
                            <!-- Datos fijos informativos -->
                            <div class="mb-2">
                                <label class="form-label fw-bold small">DNI (No editable):</label>
                                <input type="text" id="lblDni" class="form-control form-control-sm bg-light" readonly>
                            </div>
                            <div class="mb-2">
                                <label class="form-label fw-bold small">Nombre Completo:</label>
                                <input type="text" id="lblNombre" class="form-control form-control-sm bg-light" readonly>
                            </div>
                            <div class="mb-2">
                                <label class="form-label fw-bold small">Ficha Familiar:</label>
                                <input type="text" id="lblFamiliar" class="form-control form-control-sm bg-light" readonly>
                            </div>

                            <hr class="my-3">
                            <p class="text-muted small fw-bold">CAMPOS EDITABLES:</p>

                            <!-- Historia Clínica -->
                            <div class="mb-2">
                                <label for="val_hclinica" class="form-label small">Nro. Historia Clínica (`hclinica`):</label>
                                <input type="text" id="val_hclinica" class="form-control" data-col="hclinica">
                            </div>

                            <!-- Teléfono Principal -->
                            <div class="mb-2">
                                <label for="val_telefono" class="form-label small">Teléfono Principal (`telefono`):</label>
                                <input type="text" id="val_telefono" class="form-control" data-col="telefono">
                            </div>

                            <!-- Teléfono 2 (Columna M en adelante) -->
                            <div class="mb-2">
                                <label for="val_telefono_2" class="form-label small">Teléfono 2 / Columna M (`telefono_2` o cambia el nombre según tu Sheet):</label>
                                <input type="text" id="val_telefono_2" class="form-control" data-col="telefono_2">
                            </div>

                            <!-- Estado Civil -->
                            <div class="mb-2">
                                <label for="val_estado_civil" class="form-label small">Estado Civil (`estado_civil`):</label>
                                <input type="text" id="val_estado_civil" class="form-control" data-col="estado_civil">
                            </div>

                            <!-- Sector -->
                            <div class="mb-2">
                                <label for="val_sector" class="form-label small">Sector (`sector`):</label>
                                <input type="text" id="val_sector" class="form-control" data-col="sector">
                            </div>

                            <!-- Referencia de Dirección -->
                            <div class="mb-2">
                                <label for="val_ref_direccion" class="form-label small">Referencia de Dirección (`ref_direccion`):</label>
                                <input type="text" id="val_ref_direccion" class="form-control" data-col="ref_direccion">
                            </div>

                            <!-- Manzana -->
                            <div class="mb-2">
                                <label for="val_mz" class="form-label small">Manzana (`mz`):</label>
                                <input type="text" id="val_mz" class="form-control" data-col="mz">
                            </div>

                            <!-- Georeferencia / GPS -->
                            <div class="mb-3">
                                <label for="val_georeferencia" class="form-label small">Georeferencia / GPS (`georeferencia`):</label>
                                <div class="input-group">
                                    <input type="text" id="val_georeferencia" class="form-control" data-col="georeferencia">
                                    <button class="btn btn-outline-secondary btn-sm" type="button" onclick="obtenerUbicacionActual()">📍 GPS Actual</button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100 mt-2">Guardar Cambios</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_ADMIN = 'https://script.google.com/macros/s/AKfycbxmqviwzICjqWFCu9S5cx0Jb4Kp3Si9CcDLmEEALkgKH6VCAmzRJ66SLtPZaBjmbbqu/exec';
        let dniActual = "";

        function mostrarLoader(mostrar) {
            document.getElementById('loader').style.display = mostrar ? 'flex' : 'none';
        }

        function mostrarAlerta(texto, tipo) {
            const alerta = document.getElementById('mensajeAlerta');
            alerta.className = `alert alert-${tipo} mt-3`;
            alerta.textContent = texto;
            alerta.classList.remove('d-none');
        }

        async function buscarPorDni() {
            const dni = document.getElementById('inputDni').value.trim();
            if (!dni) {
                alert("Por favor ingrese un DNI válido.");
                return;
            }

            mostrarLoader(true);
            document.getElementById('formContainer').classList.add('d-none');
            document.getElementById('mensajeAlerta').classList.add('d-none');

            try {
                const response = await fetch(`${SCRIPT_ADMIN}?action=buscar&dni=${dni}`);
                const data = await response.json();

                if (data.status === "error" || !data.dni) {
                    mostrarAlerta("❌ No se encontró ningún registro con el DNI ingresado.", "danger");
                } else {
                    dniActual = data.dni;
                    // Llenar datos de lectura fija
                    document.getElementById('lblDni').value = data.dni || "";
                    document.getElementById('lblNombre').value = data.nombreB || "";
                    document.getElementById('lblFamiliar').value = data.ffamiliar || "";

                    // Llenar campos editables con las propiedades devueltas dinámicamente por el script
                    document.getElementById('val_hclinica').value = data.hclinica || "";
                    document.getElementById('val_telefono').value = data.telefono || "";
                    
                    // Si en tu columna M tienes un nombre específico (ej. "telefono_2" o "telefono-1"), cámbialo aquí según tu cabecera exacta de Google Sheets:
                    document.getElementById('val_telefono_2').value = data.telefono_2 || data["telefono-1"] || ""; 
                    
                    document.getElementById('val_estado_civil').value = data.estado_civil || "";
                    document.getElementById('val_sector').value = data.sector || "";
                    document.getElementById('val_ref_direccion').value = data.ref_direccion || "";
                    document.getElementById('val_mz').value = data.mz || "";
                    document.getElementById('val_georeferencia').value = data.georeferencia || "";

                    document.getElementById('formContainer').classList.remove('d-none');
                    mostrarAlerta("✅ Registro encontrado con éxito.", "success");
                }
            } catch (error) {
                console.error(error);
                mostrarAlerta("❌ Error de conexión al consultar el servidor.", "danger");
            } finally {
                mostrarLoader(false);
            }
        }

        async function guardarCambios(event) {
            event.preventDefault();
            if (!dniActual) return;

            // Recolectar los inputs editables y enviar sus cambios columna por columna usando tu función 'actualizarColumna'
            const inputs = document.querySelectorAll('#editForm input[data-col]');
            mostrarLoader(true);

            let errores = 0;

            for (let input of inputs) {
                let columna = input.getAttribute('data-col');
                let valor = input.value;

                try {
                    const url = `${SCRIPT_ADMIN}?action=actualizarColumna&dni=${dniActual}&columna=${encodeURIComponent(columna)}&valor=${encodeURIComponent(valor)}`;
                    const response = await fetch(url);
                    const resultadoTexto = await response.text();
                    
                    if (!resultadoTexto.includes("✅")) {
                        errores++;
                    }
                } catch (e) {
                    errores++;
                    console.error(`Error actualizando ${columna}:`, e);
                }
            }

            mostrarLoader(false);

            if (errores === 0) {
                alert("🎉 ¡Todos los cambios se guardaron correctamente en la base de datos!");
                mostrarAlerta("✅ ¡Datos actualizados con éxito!", "success");
            } else {
                alert("⚠️ Hubo algunos errores al actualizar ciertas columnas. Verifique los nombres en las cabeceras de su Google Sheet.");
                mostrarAlerta("⚠️ Algunos campos no pudieron actualizarse.", "warning");
            }
        }

        function obtenerUbicacionActual() {
            if (navigator.geolocation) {
                mostrarLoader(true);
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        document.getElementById('val_georeferencia').value = `${lat}, ${lng}`;
                        mostrarLoader(false);
                    },
                    (error) => {
                        mostrarLoader(false);
                        alert("No se pudo obtener la ubicación GPS: " + error.message);
                    }
                );
            } else {
                alert("La geolocalización no es compatible con este navegador.");
            }
        }
    </script>
</body>
</html>
